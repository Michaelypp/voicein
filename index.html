<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>VoiceIn · 语音输入</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#f3f4f6;color:#111827}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#eef2ff,#f8fafc)}
    main{width:min(720px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:28px;box-shadow:0 18px 55px rgba(15,23,42,.1)}
    header,.toolbar,.actions,.status{display:flex;align-items:center;gap:12px}header,.toolbar{justify-content:space-between;flex-wrap:wrap}
    h1{font-size:1.45rem;margin:0}.sub{color:#64748b;margin:6px 0 24px}.status{font-size:.95rem}.dot{width:10px;height:10px;border-radius:50%;background:#94a3b8}
    [data-state="listening"] .dot{background:#ef4444;animation:pulse 1.2s infinite}.toolbar{margin-bottom:12px}label{font-size:.9rem;color:#475569}
    select,textarea,button{font:inherit}select{padding:8px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:#111827}
    textarea{width:100%;min-height:230px;padding:16px;border:1px solid #cbd5e1;border-radius:16px;resize:vertical;background:#fff;color:#111827;outline:none;font-size:1rem;line-height:1.7}
    textarea:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.16)}.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
    button{border:0;border-radius:12px;padding:10px 15px;cursor:pointer;background:#e2e8f0;color:#0f172a}button.primary{background:#4f46e5;color:#fff}button.ghost{background:transparent;color:#64748b}button:disabled{opacity:.5;cursor:not-allowed}
    .count,.error{font-size:.88rem;color:#64748b}.error{color:#dc2626;min-height:1.3em;margin-top:12px}@keyframes pulse{50%{opacity:.35;transform:scale(.75)}}
    @media(prefers-color-scheme:dark){:root{background:#0f172a;color:#f8fafc}body{background:linear-gradient(145deg,#111827,#020617)}main{background:#111827;border-color:#334155;box-shadow:none}.sub,label,.count{color:#94a3b8}select,textarea{background:#0f172a;color:#f8fafc;border-color:#475569}button{background:#334155;color:#f8fafc}button.ghost{background:transparent;color:#94a3b8}}
    @media(max-width:520px){body{padding:12px}main{padding:20px;border-radius:18px}.actions{width:100%;display:grid;grid-template-columns:1fr 1fr}.actions .primary{grid-column:1/-1}}
    @media(prefers-reduced-motion:reduce){[data-state="listening"] .dot{animation:none}}
  </style>
</head>
<body>
<main id="app" data-state="idle">
  <header><div><h1>VoiceIn</h1><p class="sub">说出来，马上变成文字。</p></div><div class="status" aria-live="polite"><span class="dot"></span><span id="status">准备就绪</span></div></header>
  <div class="toolbar"><label for="language">识别语言</label><select id="language"><option value="zh-CN">普通话</option><option value="zh-TW">中文（台湾）</option><option value="zh-HK">粤语</option><option value="en-US">English</option></select></div>
  <textarea id="text" aria-label="识别文字" placeholder="点击“开始说话”，允许麦克风权限后即可语音输入。"></textarea>
  <div class="footer"><div class="actions"><button id="toggle" class="primary">🎙️ 开始说话</button><button id="copy">复制文字</button><button id="clear" class="ghost">清空</button></div><span id="count" class="count">0 字</span></div>
  <div id="error" class="error" role="alert"></div>
</main>
<script>
(()=>{const app=document.querySelector('#app'),text=document.querySelector('#text'),toggle=document.querySelector('#toggle'),copy=document.querySelector('#copy'),clear=document.querySelector('#clear'),language=document.querySelector('#language'),status=document.querySelector('#status'),count=document.querySelector('#count'),error=document.querySelector('#error');const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;let recognition,listening=false,committed='';const updateCount=()=>count.textContent=`${text.value.replace(/\s/g,'').length} 字`;const setListening=v=>{listening=v;app.dataset.state=v?'listening':'idle';status.textContent=v?'正在聆听…':'准备就绪';toggle.textContent=v?'⏹ 停止录音':'🎙️ 开始说话'};if(!SpeechRecognition){toggle.disabled=true;error.textContent='当前浏览器不支持语音识别，请使用最新版 Chrome 或 Edge。'}else{recognition=new SpeechRecognition;recognition.continuous=true;recognition.interimResults=true;recognition.onstart=()=>{committed=text.value;error.textContent='';setListening(true)};recognition.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const chunk=e.results[i][0].transcript;if(e.results[i].isFinal)committed+=chunk;else interim+=chunk}text.value=committed+interim;updateCount()};recognition.onerror=e=>{const messages={'not-allowed':'没有麦克风权限，请允许浏览器访问麦克风。','no-speech':'没有听到语音，请靠近麦克风再试一次。','audio-capture':'未检测到可用的麦克风。','network':'语音识别服务暂时无法连接。'};error.textContent=messages[e.error]||`识别失败：${e.error}`};recognition.onend=()=>setListening(false)}toggle.onclick=()=>{if(!recognition)return;if(listening)recognition.stop();else{recognition.lang=language.value;try{recognition.start()}catch{}}};language.onchange=()=>{if(listening){recognition.stop();error.textContent='语言已切换，请重新开始说话。'}};text.oninput=()=>{committed=text.value;updateCount()};clear.onclick=()=>{text.value='';committed='';error.textContent='';updateCount();text.focus()};copy.onclick=async()=>{if(!text.value){error.textContent='还没有可复制的文字。';return}try{await navigator.clipboard.writeText(text.value);status.textContent='已复制';setTimeout(()=>{if(!listening)status.textContent='准备就绪'},1500)}catch{text.select();error.textContent='自动复制失败，文字已选中，请手动复制。'}};updateCount()})();
</script>
</body>
</html>
